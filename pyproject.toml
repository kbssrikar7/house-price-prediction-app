[project]
name = "ml-portfolio-project"
version = "0.1.0"
description = "Production-quality end-to-end ML portfolio project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core data science
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",

    # Machine learning
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",

    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0",

    # MLOps & Serving
    "mlflow>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "evidently>=0.4.0",  # For drift detection

    # Notebook support
    "jupyterlab>=4.0.0",
    "ipywidgets>=8.0.0",

    # Model persistence
    "joblib>=1.3.0",

    # Data acquisition
    "kaggle>=1.5.0",

    # Utilities
    "tabulate>=0.9.0",
    "PyYAML>=6.0",
    "streamlit>=1.25.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.82.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests",
    "property: Property-based tests",
    "slow: Slow running tests",
    "integration: Integration tests"
]
addopts = "-v --tb=short --cov=src --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning"
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError"
]
