name: ML Pipeline CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      
      - name: Set up Python
        run: uv python install 3.11
      
      - name: Install dependencies
        run: uv sync --all-extras --dev
      
      # Ruff might not be configured fully yet, but we can try running it
      # - name: Run linting
      #   run: uv run ruff check src/ tests/
      
      # Mypy might need configuration
      # - name: Run type checking
      #   run: uv run mypy src/ --ignore-missing-imports
      
      - name: Run tests
        run: uv run pytest tests/ -v --cov=src --cov-report=xml
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }} # Token required for private repos, optional for public

  notebook-test:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      
      - name: Set up Python
        run: uv python install 3.11
      
      - name: Install dependencies
        run: uv sync --all-extras --dev
      
      # Notebook tests require data which might not be checked in
      # Skipping unless we download data or mock it
      # - name: Test notebooks execute
      #   run: |
      #     uv run jupyter nbconvert --to notebook --execute notebooks/01_EDA_and_FeatureEngineering.ipynb --output /tmp/test1.ipynb || echo "Notebook 1 requires data"
      #     uv run jupyter nbconvert --to notebook --execute notebooks/02_Modeling_and_Evaluation.ipynb --output /tmp/test2.ipynb || echo "Notebook 2 requires data"

  docker:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker build -t ml-portfolio:test .
      
      - name: Test Docker image
        run: docker run --rm ml-portfolio:test python -c "import src; print('OK')"
